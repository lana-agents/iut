name: Verso Blueprint

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'blueprint-verso/**'
      - 'Iut4Sec1/**'
      - 'Iut4Sec1.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/verso-blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-verso-blueprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build blueprint site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        uses: actions/cache@v4
        with:
          path: blueprint-verso/.lake/packages
          key: ${{ runner.os }}-blueprint-lake-packages-${{ hashFiles('blueprint-verso/lean-toolchain', 'blueprint-verso/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-blueprint-lake-packages-

      - name: Restore Lean build cache
        uses: actions/cache@v4
        with:
          path: blueprint-verso/.lake/build
          key: ${{ runner.os }}-blueprint-lean-build-${{ hashFiles('blueprint-verso/lean-toolchain', 'blueprint-verso/lake-manifest.json', 'blueprint-verso/lakefile.toml', 'blueprint-verso/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-blueprint-lean-build-${{ hashFiles('blueprint-verso/lean-toolchain', 'blueprint-verso/lake-manifest.json', 'blueprint-verso/lakefile.toml') }}-
            ${{ runner.os }}-blueprint-lean-build-

      - name: Build blueprint site
        run: ./blueprint-verso/scripts/ci-pages.sh

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: verso-blueprint-site
          path: blueprint-verso/_out/site/html-multi

  deploy:
    name: Deploy to GitHub Pages (/verso-blueprint)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: verso-blueprint-site
          path: _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: verso-blueprint
          force: false
          commit-message: 'deploy verso blueprint for ${{ github.sha }}'
