name = "iut"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Iut", "Iut4Sec1", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
warn.sorry = false # the proof placeholder of Comparator/Challenge.lean

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# Tate q-parameters, the classical theta function and the Kummer classes of its values
# (taxis #13/#37; `TateCurvesTheta.Kummer`, consumed by `Iut/EtaleTheta`); consumed by
# the initial Θ-data and Corollary 3.12 variant strand (taxis #33).
[[require]]
name = "tate-curves-theta"
git = "https://github.com/lana-agents/tate-curves-theta"
rev = "d1fba94861c886b671f4137ab35e24b7474c9e00"

# The p-adic logarithm and the
# trace-duality lemmas for finite Q_p-algebras (IUT IV, Proposition 1.1).
[[require]]
name = "padic-log-volume"
git = "https://github.com/lana-agents/padic-log-volume"
rev = "9a190da26368465ccf92561bc283fe710ae730f0"

# Arithmetic elliptic curves in general position (taxis #2): the height formalism and
# Theorem 2.1, consumed by the ABC target statement and the implication strand
# (taxis #1449, #1451, #1455). The lana-agents fork carries the genuine height theory of
# curves over number fields and its proof package (Genl.Curves, branch wp-height-theory).
[[require]]
name = "genl"
git = "https://github.com/lana-agents/genl"
rev = "179e26f6f7becc379b32ea526aaf7fb8ae81441a"

# Heights and elliptic-curve height estimates (taxis #32): the complex uniformization of
# elliptic curves, consumed by the archimedean torsion bound of the cyclic-subgroup bound;
# also the height machine on curves used by Genl.Curves (branch wp-integrate).
[[require]]
name = "heights"
git = "https://github.com/lana-agents/heights"
rev = "f4379dbccc8cdc4faa894a236d5581a6a635c5b5"

# Étale fundamental groups (Galois-theoretic π₁, inertia) and cores of orbicurves
# ([CanLift] §2), consumed by the genuine instance of Iut.Anabelian.EtalePi1Theory; also
# the Lefschetz principle for [CanLift], Prop. 2.7 (`AffOrbicurve.canLift27_of_complex`,
# branch wp-core-basechange).
[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "d7e705ffcffbf9c87b64418a0cf864245be982cc"

# [CanLift], Prop. 2.7 over ℂ (`OrbicurveCores.U2.canLift27C`, branch wp-u2), which together
# with `AffOrbicurve.canLift27_of_complex` discharges `AffOrbicurve.CanLift27`.
[[require]]
name = "orbicurve-cores"
git = "https://github.com/lana-agents/orbicurve-cores"
rev = "d08559e6c9eba410a1ed102e7f4cc8abfddcbbbc"

# Pinned directly to the warning-free revision (also pinned by `heights`).
[[require]]
name = "belyi"
git = "https://github.com/lana-agents/belyi"
rev = "7206d7839b5bb76a08343a2436384ba85e046e0e"

# Pinned directly so that one warning-free `oka` revision serves `belyi`, `genl`,
# `orbicurve-cores` (which pins the ancestor 75dcdc3) and `tempered-fundamental-groups`.
[[require]]
name = "oka"
git = "https://github.com/lana-agents/oka.git"
rev = "7f2a6241f6db0693605838b5513b5fbafec14783"
# The tempered fundamental group of the model orbicurves (taxis #7): the construction through
# integral models, `TemperedFundamentalGroups.temperedPi1`, consumed by
# `Iut.Anabelian.TemperedPi1Theory` in `Iut/Anabelian/Tempered.lean`.
[[require]]
name = "tempered-fundamental-groups"
git = "https://github.com/lana-agents/tempered-fundamental-groups"
rev = "1143e13753c3640d5d77c7fb828ab36251da7972"

# Local class field theory and the Brauer group of p-adic fields (roadmap P8/P9): the Artin
# map, local duality and `h2MuEquiv`, consumed by the absolute anabelian reconstruction of
# `Iut/Reconstruction` ([AbsTopI]-[AbsTopIII], roadmap P17).
[[require]]
name = "local-class-field-theory"
git = "https://github.com/lana-agents/local-class-field-theory"
rev = "a6655a871f92138e486362f08f7df48204f3e985"

# Function fields of curves: places, divisors, Riemann–Roch (`WeilCurves.FunctionField`), and the
# linear-system input of Uchida's lemma over an algebraically closed field ([AbsTopIII],
# Props 1.1(ii), 1.2; `WeilCurves.FunctionField.LinearSystem`), consumed by the correctness
# of the Uchida algorithm (`Iut/Reconstruction/Uchida/FunctionField.lean`, MR9 step U2).
[[require]]
name = "weil-curves"
git = "https://github.com/lana-agents/weil-curves"
rev = "1cadab4e0a16f6a315a18e52369fbf45048ec503"

# The coordinated pin train after MR8.5 (2026-10-19): these transitive dependencies are pinned
# directly so that one revision of each serves the whole dependency graph (`local-class-field-theory`,
# `tate-curves-theta`, `tempered-fundamental-groups` and `curves-jacobian` pin older ancestors).
[[require]]
name = "continuous-kummer-theory"
git = "https://github.com/lana-agents/continuous-kummer-theory"
rev = "1d5194fcc63ddeb7a8cdb6c98d59452503db60fa"

[[require]]
name = "formal-schemes"
git = "https://github.com/lana-agents/formal-schemes"
rev = "e58ecf04554f14c8d1cc2753136f9d785525df5a"

[[require]]
name = "elliptic-curves"
git = "https://github.com/lana-agents/elliptic-curves"
rev = "e70086a9c442dcfe76152fa03777091c50985d43"

# Curves over number fields and their Jacobians, with Belyi cuspidalisation ([AbsTopII] Cor 3.7,
# 3.8: `CurvesJacobian.belyiCusp_spec`, MR8.5/8.6), consumed by `Iut/Reconstruction/Cusp`
# (MR8.8) and by the MR9 K-steps (MR5 outputs).
[[require]]
name = "curves-jacobian"
git = "https://github.com/lana-agents/curves-jacobian"
rev = "4e5483f35891925f225a3319cea1a2158a47aa8e"

# Corollary 3.12 variant (IUT III) and the ABC target statement.
[[lean_lib]]
name = "Iut"

# Section 1 of IUT IV, "Log-volume Estimates".
[[lean_lib]]
name = "Iut4Sec1"

# Comparator challenge/solution roots for the main theorem (Iut.abc_of_cor312Variant).
# They declare matching names and must remain in separate environments.
[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"

# Local replacement for checkdecls that omits the duplicate comparator roots.
[[lean_exe]]
name = "checkdecls"
root = "CheckDecls"
supportInterpreter = true
weakLinkArgs = ["-lLake"]
