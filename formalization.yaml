version: "v0.4"

project:
  name: "iut"
  description: >-
    The IUT-specific part of the LANA ABC programme, in Lean 4 / Mathlib. It does NOT verify
    inter-universal Teichmüller theory. Its main theorem, Iut.classicalABC_of_variant, is the
    implication "a project-owner-specified variant of IUT III, Corollary 3.12 implies the
    classical ABC conjecture": the variant (Iut.Cor312VariantHolds, quantified over exactly the
    initial Θ-data of IUT I, Definition 3.1) is a hypothesis, and the implication is proved along
    IUT IV (Theorem 1.10, Corollaries 2.2 and 2.3) and [GenEll] Theorem 2.1 for the tripod
    ℙ¹ ∖ {0,1,∞}. Along the way the repository constructs the initial Θ-data as statements about
    genuine objects (model orbicurves, their étale fundamental groups, cores and tempered
    fundamental groups), the tensor packets of log-shells with their p-adic logarithm,
    normalized Haar log-volume and holomorphic hulls, the theta-pilot region, and the tower
    arithmetic of Theorem 1.10 for the curves of the tripod. It identifies the tempered group Π_v
    of the Θ-data at the bad places with André's tempered fundamental group, and proves Theorem B
    (nondegeneracy) for the tempered groups of the geometric presentations of the Tate
    orbicurves of the Θ-data. A separate library, Iut4Sec1, formalizes self-contained
    mathematics of IUT IV, Section 1 ("Log-volume Estimates"). A comparator challenge
    (Comparator/Challenge.lean) states that the hypothesis of the main theorem implies the
    official ABC statement of google-deepmind/formal-conjectures.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
    - "Dagur Asgeirsson"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Inter-universal Teichmüller Theory I: Construction of Hodge Theaters"
    authors: ["Shinichi Mochizuki"]
    id: "doi:10.4171/PRIMS/57-1-1"
    type: "article"
    location: "Publ. RIMS 57 (2021), 3-207; Definition 3.1 (initial Θ-data), Example 3.2(iv)"
    relationship: "formalizes"
    note: >-
      The initial Θ-data of Definition 3.1 are formalized as Iut.InitialThetaData, with the
      conditions (d)-(f) stated about the genuine model orbicurves, étale and tempered
      fundamental groups and cores. The hypothesis of the main theorem ranges over exactly these
      Θ-data.
    author_endorsement: "not-contacted"
  - title: "Inter-universal Teichmüller Theory II: Hodge-Arakelov-theoretic Evaluation"
    authors: ["Shinichi Mochizuki"]
    id: "doi:10.4171/PRIMS/57-1-2"
    type: "article"
    location: "Publ. RIMS 57 (2021), 209-401"
    relationship: "background"
    note: "Not formalized; background for the theta-pilot objects used in IUT III and IV."
    author_endorsement: "not-contacted"
  - title: "Inter-universal Teichmüller Theory III: Canonical Splittings of the Log-theta-lattice"
    authors: ["Shinichi Mochizuki"]
    id: "doi:10.4171/PRIMS/57-1-3"
    type: "article"
    location: >-
      Publ. RIMS 57 (2021), 403-626; Corollary 3.12 (stated as a variant, assumed, not proved),
      Propositions 3.1, 3.2, 3.9 and Remark 3.9.5 (processions, tensor packets of log-shells,
      large volume container)
    relationship: "adapts"
    note: >-
      Corollary 3.12 enters only as a project-owner-specified variant
      (Iut.Corollary312Variant, Iut.Cor312VariantHolds), which is a hypothesis of the main
      theorem. It is not proved here and is not identified with the published Corollary 3.12.
    author_endorsement: "not-contacted"
  - title: "Inter-universal Teichmüller Theory IV: Log-volume Computations and Set-theoretic Foundations"
    authors: ["Shinichi Mochizuki"]
    id: "doi:10.4171/PRIMS/57-1-4"
    type: "article"
    location: >-
      Publ. RIMS 57 (2021), 627-723; §1 (Propositions 1.2-1.8, Definition 1.9, Theorem 1.10)
      and §2 (Proposition 2.1, Corollaries 2.2 and 2.3)
    relationship: "formalizes"
    note: >-
      Theorem 1.10 (Iut.Theorem110Invariants.theorem110) and Corollaries 2.2, 2.3 are proved
      from the Corollary 3.12 variant. Proposition 1.6 is used with the factor 3/2 in place of
      the printed 4/3 (proved from Mathlib's Chebyshev bound); the printed 4/3 is not
      formalized. The Iut4Sec1 library formalizes parts of §1 (Propositions 1.4(iii),
      1.7, (E1)/(E2), Definition 1.9(i)).
    author_endorsement: "not-contacted"
  - title: "Arithmetic Elliptic Curves in General Position"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    location: "Math. J. Okayama Univ. 52 (2010), 1-28; Theorem 2.1, Proposition 3.4, Lemmas 3.2(i), 3.5"
    relationship: "adapts"
    note: >-
      [GenEll]. Theorem 2.1(ii) => (i) and the target statement are proved for the tripod in
      this repository (Iut.Tripod.statementI_of_statementII); the general height formalism is in
      lana-agents/genl. The cyclic-subgroup bound of Lemma 3.5 is proved for the tripod curves in
      a form weakened at the prime 2 (see fidelity).
    author_endorsement: "not-contacted"
  - title: "The Absolute Anabelian Geometry of Canonical Curves"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    location: "Documenta Math. Extra Volume Kato (2003), 609-640; §2, Proposition 2.7"
    relationship: "adapts"
    note: "[CanLift]: k-cores (§2) and Proposition 2.7 (Iut.Anabelian.canLift27)."
    author_endorsement: "not-contacted"

