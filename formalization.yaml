automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5", "claude-fable-5-1", "claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    The main theorem is a conditional implication, not a proof of ABC: Iut.classicalABC_of_variant
    : Iut.Cor312VariantHolds → Iut.ClassicalABC, with h312 (the Corollary 3.12 variant) as a
    hypothesis. The variant Iut.Corollary312Variant (−|log(q)| ≤ −|log(Θ)|) is specified by the
    project owner and differs in some respects from the formulation printed in IUT III; it is
    deliberately not identified with the published Corollary 3.12. h312 ranges over exactly the
    initial Θ-data of IUT I, Definition 3.1 (Iut.InitialThetaData) and nothing else; the q-pilot
    data, tensor packets, log-volumes, hulls and theta-pilot region are constructed from D
    (Iut.concreteVariantData D). The ABC target is reached through [GenEll] Theorem 2.1 for the
    tripod ℙ¹ ∖ {0,1,∞}. Proposition 1.6 of IUT IV is used with the factor 3/2 instead of 4/3.
    Reduction predicates are stated up to a global change of variables (properties of the curve,
    not of a Weierstrass model). The cyclic-subgroup bound of [GenEll] Lemma 3.5 is proved for the
    tripod curves in a form weakened at the prime 2. Two local statements (the scaling law
    componentVol_prime_preimage and IUT IV, Proposition 1.4(iii)) are restricted to packets all of
    whose places lie over p, where the unrestricted statements are false; they are only applied
    there. Boundary for Theorem B: Iut.InitialThetaData.tate_nondegenerate is about the tempered
    group of the geometric presentation Orbicurve.affineOrbifold of the model orbicurve
    (E_{q_w}, ℓ, M, ±), not literally about LocalThetaData.PivBad (the tempered group of the
    local model in its Galois presentation Genuine.orbifold, isomorphic to E_{q_w} only after a
    change of variables); invariance under a change of Weierstrass model and the comparison of
    the two presentations are not formalized. In Iut4Sec1, Definition 1.9(ii)'s globally
    normalized quotient is not claimed.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel (axioms as listed under status); the main
    theorem is conditional on the Corollary 3.12 variant h312, which is a hypothesis and is not
    proved. The comparator challenge Comparator/Challenge.lean states, as
    Iut.abc_of_cor312Variant, that h312 implies the official ABC statement ABC.abc of
    google-deepmind/formal-conjectures (FormalConjectures/Wikipedia/ABC.lean, commit
    1646ca16afd6cc7a693d3bdc9f066c4d3cc01a89, Apache-2.0), verbatim with their definition
    ABC.radical, with one deliberate proof placeholder (not counted in sorry_count);
    Comparator/Solution.lean proves it by Iut.formalConjecturesABC_of_variant.

alignment:
  namespace: "Iut"
  statements:
    - source: "IUT III, Corollary 3.12 (project-owner-specified variant)"
      lean: "Iut.Corollary312Variant"
      module: "Iut/Cor312/Statement.lean"
      status: "stated (not proved)"
    - source: "IUT III, Corollary 3.12 variant for all initial Θ-data (the hypothesis h312)"
      lean: "Iut.Cor312VariantHolds"
      module: "Iut/Concrete/ThetaRegion.lean"
      status: "stated (hypothesis of the main theorem, not proved)"
    - source: "IUT I, Definition 3.1 (initial Θ-data)"
      lean: "Iut.InitialThetaData"
      module: "Iut/Cor312/ThetaData/Basic.lean"
      status: "defined"
    - source: "IUT IV, Theorem 1.10"
      lean: "Iut.Theorem110Invariants.theorem110"
      module: "Iut/Implication/Theorem110.lean"
      status: "proved from the variant"
    - source: "IUT IV, Corollary 2.2(ii),(iii)"
      lean: "Iut.Corollary22Inputs.c2"
      module: "Iut/Implication/Corollary22.lean"
      status: "proved"
    - source: "IUT IV, Corollary 2.3"
      lean: "Iut.statementII_of_cor312"
      module: "Iut/Implication/Corollary23.lean"
      status: "proved from the variant"
    - source: "IUT III, Corollary 3.12 variant => classical ABC"
      lean: "Iut.classicalABC_of_variant"
      module: "Iut/MainTheorem.lean"
      status: "proved (conditional on h312)"
    - source: "IUT I, Definition 3.1(e)/(f): Π_v is the tempered fundamental group (André)"
      lean: "Iut.LocalThetaData.pivBadEquivAndre"
      module: "Iut/Cor312/ThetaData/AndreLocal.lean"
      status: "proved"
    - source: "Theorem B (nondegeneracy of the tempered group) for the Tate curves of the Θ-data"
      lean: "Iut.InitialThetaData.tate_nondegenerate"
      module: "Iut/Cor312/ThetaData/TateTheoremB.lean"
      status: "proved"
      note: "For the geometric presentation Orbicurve.affineOrbifold, not LocalThetaData.PivBad."
    - source: "IUT IV, Proposition 1.6 (factor 3/2 instead of 4/3)"
      lean: "Iut.primeCountingHyp_holds"
      module: "Iut/Implication/ChebyshevExplicit.lean"
      status: "proved"

acknowledgements: "Built on Mathlib (Apache-2.0)."
