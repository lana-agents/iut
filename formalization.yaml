classification:
  arxiv: ["math.NT", "math.AG"]
  msc2020: ["11D75", "11G05", "11G07", "14H30", "14G32"]

status:
  scope: >-
    Conditional. The main theorem Iut.classicalABC_of_variant proves the implication
    "Corollary 3.12 variant => classical ABC": its only hypothesis h312 : Iut.Cor312VariantHolds
    (the project-owner-specified variant of IUT III, Corollary 3.12, quantified over exactly the
    initial Θ-data of IUT I, Definition 3.1) is ASSUMED, NOT PROVED, and proving it is out of
    scope; the repository does not verify IUT and does not prove the ABC conjecture. Proved
    unconditionally: the identification Iut.LocalThetaData.pivBadEquivAndre of Π_v at the bad
    places with André's tempered fundamental group; Theorem B for the Tate curves of the Θ-data
    (Iut.InitialThetaData.tate_nondegenerate, for the geometric presentation of the model
    orbicurve); and the Iut4Sec1 results of IUT IV, Section 1 listed below. Not formalized: the
    bridge from Theorem B for the geometric presentation to LocalThetaData.PivBad.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Iut.classicalABC_of_variant"
      file: "Iut/MainTheorem.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies:
        - statement: >-
            Hypothesis h312 : Iut.Cor312VariantHolds (Iut/Concrete/ThetaRegion.lean), a variant of
            Corollary 3.12 for every D : InitialThetaData. Assumed, not proved.
          source: "Inter-universal Teichmüller Theory III, Corollary 3.12"
    - declaration: "Iut.formalConjecturesABC_of_variant"
      file: "Iut/Abc/FormalConjectures.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Comparator/config.json"
      literature_dependencies:
        - statement: >-
            Hypothesis h312 : Iut.Cor312VariantHolds (Iut/Concrete/ThetaRegion.lean), a variant of
            Corollary 3.12 for every D : InitialThetaData. Assumed, not proved.
          source: "Inter-universal Teichmüller Theory III, Corollary 3.12"
    - declaration: "Iut.Theorem110Invariants.theorem110"
      file: "Iut/Implication/Theorem110.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies:
